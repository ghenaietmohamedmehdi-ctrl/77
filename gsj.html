<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ساكورا | Sakura Sensei • JLPT N5</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;family=Cairo:wght@400;600;700;900&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-purple: #c026d3;
            --soft-pink: #f472b6;
            --sky-blue: #22d3ee;
            --elegant-gold: #fcd34d;
        }
        
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Cairo', system-ui, sans-serif;
            background: linear-gradient(180deg, #0f172a 0%, #1e1133 50%, #0f172a 100%);
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        .sakura-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: linear-gradient(rgba(15,23,42,0.75), rgba(15,23,42,0.85)), url('https://picsum.photos/id/1015/2000/1200');
            background-size: cover;
            background-position: center;
            filter: brightness(0.75);
        }
        
        .floating-sakura {
            position: absolute;
            font-size: 28px;
            opacity: 0.75;
            animation: fallSakura 16s linear infinite;
            z-index: -1;
            text-shadow: 0 0 12px #f472b6;
        }
        
        @keyframes fallSakura {
            0% { transform: translateY(-100px) rotate(0deg); }
            100% { transform: translateY(120vh) rotate(720deg); }
        }
        
        .glass {
            background: rgba(255,255,255,0.09);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.18);
            box-shadow: 0 8px 32px rgba(0,0,0,0.35);
        }
        
        /* Progress Bar - Top */
        .top-progress {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15,23,42,0.95);
            backdrop-filter: blur(16px);
            padding: 12px 20px 10px;
            border-bottom: 1px solid rgba(192,38,211,0.3);
        }
        
        .xp-bar {
            height: 13px;
            background: linear-gradient(90deg, var(--sky-blue), var(--soft-pink), var(--neon-purple));
            border-radius: 9999px;
            position: relative;
            overflow: hidden;
        }
        
        .xp-bar::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.7), transparent);
            animation: xpShimmer 2.8s linear infinite;
        }
        
        @keyframes xpShimmer { 0% { transform: translateX(-150%); } 100% { transform: translateX(400%); } }
        
        .welcome-card, .motivational-panel, .path-container {
            margin: 20px;
        }
        
        .path-beam {
            position: absolute;
            top: 115px;
            left: 50%;
            width: 6px;
            height: calc(100% - 260px);
            background: linear-gradient(to bottom, #22d3ee, #f472b6, #c026d3);
            box-shadow: 0 0 35px #c026d3;
            transform: translateX(-50%);
            border-radius: 9999px;
            z-index: 1;
        }
        
        .stage {
            width: 108px;
            height: 108px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 38px auto;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 0 35px rgba(192,38,211,0.7);
        }
        
        .stage-inner {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff, #bae6fd);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 46px;
        }
        
        .keyboard {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15,23,42,0.96);
            backdrop-filter: blur(24px);
            border-top: 1px solid rgba(192,38,211,0.4);
            padding: 14px 10px 22px;
            z-index: 200;
            display: none; /* مخفي افتراضياً */
        }
        
        .key-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 9px;
        }
        
        .key {
            background: rgba(255,255,255,0.13);
            border: 1px solid rgba(255,255,255,0.25);
            color: white;
            font-size: 24px;
            font-weight: 700;
            font-family: 'Noto Sans JP', sans-serif;
            height: 58px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .key:active {
            transform: scale(0.9);
            background: var(--neon-purple);
        }
        
        .flip-card {
            perspective: 1200px;
            width: 100%;
            max-width: 340px;
            height: 260px;
            margin: 20px auto;
        }
        
        .flip-card-inner {
            transition: transform 0.85s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }
        
        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body>
    <div class="sakura-bg"></div>
    
    <!-- Progress Bar at Top -->
    <div class="top-progress">
        <div class="flex justify-between items-center mb-2 text-sm">
            <div style="font-weight:900;">Lv. 12 • سعاد</div>
            <div>⭐ <span id="stars">28</span></div>
        </div>
        <div class="xp-bar w-[72%]"></div>
        <div class="flex justify-between text-xs mt-1">
            <span>2840 XP</span>
            <span class="text-emerald-400">72% • 148/210 كلمة</span>
        </div>
    </div>
    
    <!-- Welcome -->
    <div class="welcome-card glass">
        <h1 style="font-size:23px; text-align:center; margin-bottom:10px;">مرحبًا سعاد! 🌸</h1>
        <p style="text-align:center; line-height:1.6; color:#e0e7ff;">
            أهلًا بكِ في رحلة ساكورا لتعلّم اللغة اليابانية
        </p>
    </div>
    
    <!-- Learning Path -->
    <div class="path-container relative">
        <div class="path-beam"></div>
        
        <div class="grid grid-cols-3 gap-x-6 gap-y-14 relative z-10" style="max-width:540px; margin:0 auto;">
            <div onclick="startLesson(1)" class="stage"><div class="stage-inner">🌸</div><div class="text-center mt-3 font-bold">الأساسيات</div></div>
            <div onclick="startLesson(2)" class="stage"><div class="stage-inner">🍥</div><div class="text-center mt-3 font-bold">المدود</div></div>
            <div onclick="startLesson(3)" class="stage"><div class="stage-inner">🎏</div><div class="text-center mt-3 font-bold">النطق</div></div>
            <div onclick="startLesson(4)" class="stage"><div class="stage-inner">⛩️</div><div class="text-center mt-3 font-bold">المركبات</div></div>
            <div onclick="startLesson(5)" class="stage"><div class="stage-inner">🏯</div><div class="text-center mt-3 font-bold">اليوميات</div></div>
            <div onclick="startLesson(6)" class="stage"><div class="stage-inner">🐉</div><div class="text-center mt-3 font-bold">N5 كامل</div></div>
        </div>
    </div>
    
    <!-- Study Card -->
    <div class="px-5">
        <div onclick="flipCurrentCard()" id="study-card" class="flip-card mx-auto">
            <div class="flip-card-inner glass" id="flip-inner">
                <div class="flip-face" style="backface-visibility:hidden; background:linear-gradient(135deg,#1e2937,#334155); border-radius:24px; display:flex; flex-direction:column; align-items:center; justify-content:center;">
                    <div style="font-size:88px; margin-bottom:16px;" id="hiragana-front">あさ</div>
                    <div style="font-size:26px; font-weight:700;" id="arabic-front">صباح</div>
                    <button onclick="event.stopImmediatePropagation(); speakWord()" style="margin-top:24px; width:56px; height:56px; border-radius:50%; background:#22d3ee; border:none; font-size:26px; box-shadow:0 6px 0 #164e63;">🔊</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Motivational -->
    <div class="motivational-panel glass mx-5">
        <p style="font-size:15.5px; line-height:1.75; text-align:center;">
            الأخت الفاضلة سعاد،<br>
            كل حرف تحفظينه اليوم هو لبنة في بناء إنجازكِ الكبير ✨🇯🇵
        </p>
    </div>
    
    <!-- Keyboard (يظهر فقط عند أسئلة الكتابة) -->
    <div id="keyboard" class="keyboard">
        <div class="key-row">
            <div class="key">あ</div><div class="key">い</div><div class="key">う</div><div class="key">え</div><div class="key">お</div>
        </div>
        <div class="key-row mt-3">
            <div class="key">か</div><div class="key">き</div><div class="key">く</div><div class="key">け</div><div class="key">こ</div>
        </div>
        <div onclick="submitAnswer()" class="mt-6 py-4 bg-gradient-to-r from-pink-500 to-violet-600 rounded-2xl text-center font-bold text-lg">
            تحقق ✓
        </div>
    </div>
    
    <script>
        // Sakura animation
        function createSakura() {
            const petal = document.createElement('div');
            petal.className = 'floating-sakura';
            petal.textContent = '🌸';
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.animationDuration = (14 + Math.random() * 12) + 's';
            document.body.appendChild(petal);
            setTimeout(() => petal.remove(), 32000);
        }
        
        setInterval(createSakura, 380);
        
        // Show keyboard when typing question is active
        function showKeyboard() {
            document.getElementById('keyboard').style.display = 'block';
        }
        
        function hideKeyboard() {
            document.getElementById('keyboard').style.display = 'none';
        }
        
        function flipCurrentCard() {
            document.getElementById('study-card').classList.toggle('flipped');
        }
        
        function speakWord() {
            if ('speechSynthesis' in window) {
                const u = new SpeechSynthesisUtterance("あさ");
                u.lang = 'ja-JP';
                speechSynthesis.speak(u);
